name: Memory checks
on:
  push:
    branches: [main, memory-retrieval]
    paths: ["Baymax-main/**", ".github/workflows/checks.yml"]
  pull_request:
    paths: ["Baymax-main/**", ".github/workflows/checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Baymax-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Baymax-main/requirements.lock
      - run: python -m pip install -c requirements.lock numpy chromadb pytest==9.1.1
      - run: python -m pytest memory_tests -q
        env:
          HF_HUB_OFFLINE: "1"
