name: Offline checks

on:
  push:
    branches: [main, memory-retrieval]
    paths: ["Baymax-main/**", "devops/**", ".github/workflows/checks.yml"]
  pull_request:
    paths: ["Baymax-main/**", "devops/**", ".github/workflows/checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Core, toolkit and memory tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Baymax-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Baymax-main/requirements.lock
      - name: Install audio import dependency
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install offline test dependencies
        run: >-
          python -m pip install --constraint requirements.lock
          numpy python-dotenv requests sounddevice google-genai chromadb
          opentelemetry-sdk pytest==9.1.1
      - name: Run offline checks
        env:
          HF_HUB_OFFLINE: "1"
        run: python check_release.py --report .local-review/ci-report.md
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-checks
          path: Baymax-main/.local-review/ci-report.md
          if-no-files-found: warn
