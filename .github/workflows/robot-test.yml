# Layer 2: runs a PR on the dedicated TEST robot and reports back (Baymax-main/evals/robot).
#
# Trigger: a collaborator adds the `robot-test` label to a same-repository PR.
# The robot's own runner (labels: self-hosted, ember-test-robot) checks out the
# labelled commit, runs the offline gate, then the rig: the PR's real run_mvp.py
# with the robot's microphone, echo cancellation, speaker and camera, a second
# speaker playing a synthetic "person", and a tablet showing synthetic cards.
#
# Safety: forks never run (the PR code gets a Gemini key); the guard step checks
# the labeller's write permission; the job uses the `ember-test-robot` environment,
# which holds the spending-capped GEMINI_TEST_KEY and should require the software
# lead's approval. The rig refuses to run without /etc/ember/test-robot. The room
# must be empty: microphone audio and camera frames go to Gemini.
# A pass is evidence for review, not release approval (TESTING_PROTOCOL.md).
name: Robot test

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ember-test-robot   # One robot: runs queue, never overlap.
  cancel-in-progress: false

jobs:
  robot-test:
    if: >-
      github.event.label.name == 'robot-test' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ember-test-robot]
    environment: ember-test-robot
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: write   # Only the final "Post the report" step receives the token.
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      # The rig itself comes from the default branch, so a PR cannot change the checks
      # it is judged by. Until Layer 2 is merged, the PR's own copy is used (warned).
      - name: Rig code (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: rig
          persist-credentials: false

      - name: PR under test (the labelled commit, not a later push)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Choose the rig
        run: |
          echo "REPORT_DIR=$RUNNER_TEMP/robot-report" >> "$GITHUB_ENV"
          if [ -f rig/Baymax-main/evals/robot/rig.py ]; then
            echo "RIG=$PWD/rig/Baymax-main" >> "$GITHUB_ENV"
          else
            echo "::warning::evals/robot is not on the default branch yet; using the PR's copy of the rig."
            echo "RIG=$PWD/pr/Baymax-main" >> "$GITHUB_ENV"
          fi

      - name: Guard (test robot marker, same repository, collaborator with write access)
        env:
          GITHUB_TOKEN: ${{ github.token }}   # Read-only use: the labeller's permission.
        run: python3 "$RIG/evals/robot/safety.py" --event "$GITHUB_EVENT_PATH" --repository "${{ github.repository }}"

      - name: Python environment for the PR (reuses the installed release's when unchanged)
        timeout-minutes: 45
        run: bash "$RIG/evals/robot/prepare_checkout.sh" "$PWD/pr"

      - name: Offline gate on the robot
        timeout-minutes: 20
        working-directory: pr/Baymax-main
        run: .venv/bin/python check_release.py --report "$REPORT_DIR/offline.md"

      - name: Robot suite (real runtime, synthetic person)
        timeout-minutes: 90
        env:
          GEMINI_TEST_KEY: ${{ secrets.GEMINI_TEST_KEY }}
        run: >-
          pr/Baymax-main/.venv/bin/python "$RIG/evals/robot/rig.py"
          --root pr/Baymax-main --config /etc/ember/robot-rig.json --yes
          --pr "$PR" --report-dir "$REPORT_DIR" --max-minutes 80

      - name: Stop the runtime and delete recordings (always)
        if: always()
        run: |
          if [ -x pr/Baymax-main/.venv/bin/python ]; then
            pr/Baymax-main/.venv/bin/python "$RIG/evals/robot/rig.py" --root pr/Baymax-main --cleanup
          fi
          rm -rf "${RUNNER_TEMP:?}"/ember-rig-key-* /tmp/ember-rig-key-*

      - name: Post the report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$REPORT_DIR/robot-test.md" ]; then
            python3 "$RIG/evals/robot/report.py" --post "$REPORT_DIR/robot-test.md" --pr "$PR" --repository "${{ github.repository }}"
            cat "$REPORT_DIR/robot-test.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No robot report (an earlier step failed); see this run's log." >> "$GITHUB_STEP_SUMMARY"
          fi
