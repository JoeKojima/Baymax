# Builds the robot image (Baymax-main/Dockerfile). Pull requests only check
# that it builds; pushes to main publish it to GHCR as :main and :sha-<commit>.
# Robots never run these tags directly: they follow a channel (:stable),
# which moves only when someone runs the "Promote release" workflow.
name: Robot image

on:
  push:
    branches: [main]
    paths: ["Baymax-main/**", ".github/workflows/image.yml"]
  pull_request:
    paths: ["Baymax-main/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        # GHCR names must be lowercase: JoeKojima/Baymax -> joekojima/baymax.
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: Baymax-main
          platforms: linux/amd64        # LattePanda; add linux/arm64 for the Pi 5
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}:main
            ${{ steps.name.outputs.image }}:sha-${{ steps.name.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
