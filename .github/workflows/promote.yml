# Releases a built image to a channel. Robots on that channel pick it up in
# their next 2-4 AM window (deploy/provision/ember-update.sh) and roll back
# by themselves if it doesn't start. Running this is the approval step.
#
# Actions tab -> Promote release -> Run workflow -> tag sha-1a2b3c4, channel stable
name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Built image to release, e.g. sha-1a2b3c4 (from a Robot image run)"
        required: true
      channel:
        description: "Channel the robots follow"
        type: choice
        options: [stable, beta, dev]
        default: stable

permissions:
  packages: write

concurrency:
  group: promote-${{ inputs.channel }}

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ $TAG =~ ^(sha-[0-9a-f]{7}|main)$ ]] || { echo "tag must look like sha-1a2b3c4"; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Point the channel at the image
        env:
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker buildx imagetools create -t "$IMAGE:$CHANNEL" "$IMAGE:$TAG"
          echo "$IMAGE:$CHANNEL -> $TAG (by $GITHUB_ACTOR)" >> "$GITHUB_STEP_SUMMARY"
